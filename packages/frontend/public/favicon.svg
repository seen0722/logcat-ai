<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1830"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a06a"/>
      <stop offset="100%" stop-color="#e8c9a0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb3ff"/>
      <stop offset="100%" stop-color="#4f8ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="#243049" stroke-width="2.5"/>

  <!-- Terminal bracket ">" prompt -->
  <path d="M100,160 L200,256 L100,352" fill="none" stroke="#3a4a6a" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold highlighted log line (the key insight found by AI) -->
  <rect x="230" y="238" width="200" height="36" rx="18" fill="url(#gold)" filter="url(#glow)" opacity="0.95"/>

  <!-- AI sparkle (4-pointed star) top-right -->
  <g transform="translate(388, 132)" filter="url(#glow)">
    <path d="M0,-36 C4,-12 12,-4 36,0 C12,4 4,12 0,36 C-4,12 -12,4 -36,0 C-12,-4 -4,-12 0,-36Z" fill="url(#blue)"/>
    <path d="M0,-14 C2,-5 5,-2 14,0 C5,2 2,5 0,14 C-2,5 -5,2 -14,0 C-5,-2 -2,-5 0,-14Z" fill="white" opacity="0.7"/>
  </g>

  <!-- Small sparkle bottom-left of main -->
  <g transform="translate(180, 380)" opacity="0.5">
    <path d="M0,-14 C2,-5 5,-2 14,0 C5,2 2,5 0,14 C-2,5 -5,2 -14,0 C-5,-2 -2,-5 0,-14Z" fill="#4f8ff7"/>
  </g>
</svg>
